<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Globe - IP Tracker & Location Visualizer</title>
  <!-- MapLibre 3D Library -->
  <link href="https://unpkg.com/maplibre-gl@^3.6.0/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@^3.6.0/dist/maplibre-gl.js"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Arial, sans-serif; background-color: #000; }
    #map { width: 100%; height: 100vh; }

    /* Floating Control Panel */
    .control-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      padding: 16px 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 35px rgba(0,0,0,0.8);
      width: 380px;
      color: white;
      box-sizing: border-box;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      flex: 1;
    }

    input::placeholder { color: #94a3b8; }
    input:focus { border-color: #38bdf8; background: rgba(255, 255, 255, 0.12); }

    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    button:hover { background: #0369a1; }
    button.btn-ip { background: #16a34a; }
    button.btn-ip:hover { background: #15803d; }

    .divider {
      text-align: center;
      font-size: 10px;
      color: #64748b;
      margin: 8px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Info Card Popup Styling */
    .ip-info-box {
      color: #0f172a;
      font-size: 13px;
      line-height: 1.5;
    }
    .ip-info-box b { color: #0284c7; }
  </style>
</head>
<body>

  <!-- Floating UI Panel -->
  <div class="control-panel">
    <div class="panel-title">🌐 IP & Location Visualizer</div>
    
    <!-- Option 1: IP Address Search -->
    <div class="input-row">
      <input type="text" id="ipInput" placeholder="IP Address (e.g. 8.8.8.8 ya client IP)..." />
      <button class="btn-ip" onclick="trackIP()">Track IP</button>
      <button style="background:#475569;" onclick="trackMyIP()">My IP</button>
    </div>

    <div class="divider">— YA LOCATION SEARCH KAREIN —</div>

    <!-- Option 2: Place Name Search -->
    <div class="input-row">
      <input type="text" id="searchInput" placeholder="Place Search (e.g. Ahmedabad, Taj Mahal)..." />
      <button onclick="searchLocation()">Search</button>
    </div>

    <div class="divider">— YA LAT / LON COORDINATES —</div>

    <!-- Option 3: Lat / Lon Search -->
    <div class="input-row">
      <input type="number" id="latInput" placeholder="Lat (28.6139)" step="any">
      <input type="number" id="lonInput" placeholder="Lon (77.2090)" step="any">
      <button onclick="goToCoords()">Go</button>
    </div>
  </div>

  <div id="map"></div>

  <script>
    // 1. Initialize MapLibre 3D Globe with Satellite + Labels Overlay
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'esri-satellite': {
            type: 'raster',
            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
            tileSize: 256,
            attribution: 'Esri, Maxar'
          },
          'esri-labels': {
            type: 'raster',
            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'],
            tileSize: 256
          }
        },
        layers: [
          { id: 'satellite-layer', type: 'raster', source: 'esri-satellite' },
          { id: 'labels-layer', type: 'raster', source: 'esri-labels' }
        ]
      },
      center: [77.2090, 28.6139],
      zoom: 2,
      pitch: 35,
      projection: 'globe'
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

    let currentMarker = null;

    // Common Fly-To & Marker Function
    function flyToTarget(lon, lat, popupHTMLContent) {
      if (currentMarker) currentMarker.remove();

      // Red pin for targeted location
      currentMarker = new maplibregl.Marker({ color: '#ef4444' })
        .setLngLat([lon, lat])
        .setPopup(new maplibregl.Popup().setHTML(popupHTMLContent))
        .addTo(map);

      // Open popup automatically
      currentMarker.togglePopup();

      map.flyTo({
        center: [lon, lat],
        zoom: 13,     // Zoom level for IP precision
        pitch: 50,    // 3D Angle
        speed: 1.2,
        curve: 1.4,
        essential: true
      });
    }

    // FUNCTION 1: IP Address Track Function
// Smart Multi-API IP Geolocation Function (Auto-Fallback)
async function fetchIPInfo(ip) {
  // --- Service 1: FreeIPAPI (Very High Rate Limit, HTTPS) ---
  try {
    const res = await fetch(`https://freeipapi.com/api/json/${ip}`);
    if (res.ok) {
      const data = await res.json();
      if (data && data.latitude) {
        return {
          success: true,
          ip: data.ipAddress || ip,
          country: data.countryName || 'N/A',
          city: data.cityName || 'N/A',
          region: data.regionName || 'N/A',
          latitude: data.latitude,
          longitude: data.longitude,
          isp: data.zipCode ? `Postal Code: ${data.zipCode}` : 'N/A'
        };
      }
    }
  } catch (e) {
    console.warn("Service 1 failed, trying Service 2...");
  }

  // --- Service 2: IPWho.is (Backup 1) ---
  try {
    const res = await fetch(`https://ipwho.is/${ip}`);
    if (res.ok) {
      const data = await res.json();
      if (data.success) {
        return {
          success: true,
          ip: data.ip,
          country: data.country,
          city: data.city,
          region: data.region,
          latitude: data.latitude,
          longitude: data.longitude,
          isp: data.connection?.isp || 'N/A'
        };
      }
    }
  } catch (e) {
    console.warn("Service 2 failed, trying Service 3...");
  }

  // --- Service 3: IPAPI.co (Backup 2) ---
  try {
    const res = await fetch(`https://ipapi.co/${ip}/json/`);
    if (res.ok) {
      const data = await res.json();
      if (data && data.latitude && !data.error) {
        return {
          success: true,
          ip: data.ip,
          country: data.country_name,
          city: data.city,
          region: data.region,
          latitude: data.latitude,
          longitude: data.longitude,
          isp: data.org || data.asn || 'N/A'
        };
      }
    }
  } catch (e) {
    console.warn("All services failed.");
  }

  return { success: false, message: "Saare Free APIs ki limit filhal khatam ho gayi hai. Kuch der baad try karein." };
}

// Updated Track IP Function
async function trackIP(targetIP = '') {
  const ip = targetIP || document.getElementById('ipInput').value.trim();
  
  // Show loading indicator
  const btn = document.querySelector('.btn-ip');
  const originalText = btn.innerText;
  btn.innerText = 'Tracking...';
  btn.disabled = true;

  const data = await fetchIPInfo(ip);

  btn.innerText = originalText;
  btn.disabled = false;

  if (!data.success) {
    alert(data.message);
    return;
  }

  const lat = data.latitude;
  const lon = data.longitude;

  // Auto-fill input fields
  document.getElementById('latInput').value = lat;
  document.getElementById('lonInput').value = lon;
  document.getElementById('ipInput').value = data.ip;

  const popupHTML = `
    <div class="ip-info-box">
      <h4 style="margin:0 0 6px 0; color:#0f172a;">📍 IP Details: ${data.ip}</h4>
      <b>Country:</b> ${data.country}<br>
      <b>City/Region:</b> ${data.city}, ${data.region}<br>
      <b>ISP / Info:</b> ${data.isp}<br>
      <b>Coordinates:</b> ${lat}, ${lon}
    </div>
  `;

  flyToTarget(lon, lat, popupHTML);
}

    // FUNCTION 2: Self IP Track
    function trackMyIP() {
      trackIP(''); // Empty string fetches viewer's own IP
    }

    // FUNCTION 3: Place Name Search
    async function searchLocation() {
      const query = document.getElementById('searchInput').value;
      if (!query) return;

      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
        const data = await response.json();

        if (data.length === 0) {
          alert('Yeh location nahi mili!');
          return;
        }

        const lat = parseFloat(data[0].lat);
        const lon = parseFloat(data[0].lon);

        document.getElementById('latInput').value = lat;
        document.getElementById('lonInput').value = lon;

        const popupHTML = `<div class="ip-info-box"><b>Location:</b> ${data[0].display_name}</div>`;
        flyToTarget(lon, lat, popupHTML);

      } catch (err) {
        console.error(err);
        alert('Search error!');
      }
    }

    // FUNCTION 4: Coordinates Fly
    function goToCoords() {
      const lat = parseFloat(document.getElementById('latInput').value);
      const lon = parseFloat(document.getElementById('lonInput').value);

      if (isNaN(lat) || isNaN(lon)) {
        alert('Valid Latitude aur Longitude dalein!');
        return;
      }

      const popupHTML = `<div class="ip-info-box"><b>Custom Coords:</b> ${lat}, ${lon}</div>`;
      flyToTarget(lon, lat, popupHTML);
    }

    // Enter Key Bindings
    document.getElementById('ipInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') trackIP(); });
    document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchLocation(); });
    document.getElementById('latInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') goToCoords(); });
    document.getElementById('lonInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') goToCoords(); });
  </script>
</body>
</html>
