{% block content %}
<div class="contact-container">

        <div class="contact-card gmail">
            <div class="icon">📧</div>
            <h3>Gmail</h3>
            <p><a href="mailto:hardikprajapati242008@gmail.com">hardikprajapati242008@gmail.com</a></p>
        </div>
        
        <!-- Phone -->
        <div class="contact-card phone">
            <div class="icon">📞</div>
            <h3>Phone</h3>
            <p><a href="tel:+918849880204">+91 8849880204</a></p>
        </div>

        <!-- GitHub -->
        <div class="contact-card github">
            <div class="icon">💻</div>
            <h3>GitHub</h3>
            <p><a href="https://github.com/Hxrdik-24" target="_blank">@Hxrdik-24</a></p>
        </div>

        <!-- LinkedIn -->
        <div class="contact-card linkedin">
            <div class="icon">👔</div>
            <h3>LinkedIn</h3>
            <p><a href="https://www.linkedin.com/in/hardik-prajapati-475231390/" target="_blank">LinkedIn Profile</a></p>
        </div>

        <!-- Instagram -->
        <div class="contact-card instagram">
            <div class="icon">📸</div>
            <h3>Instagram</h3>
            <p><a href="https://www.instagram.com/prajapati__hardik__24/" target="_blank">@prajapati__hardik__24</a></p>

<style>
    .contact-container {
        max-width: 900px;
        margin: 3rem auto;
        padding: 0 1.5rem;
        text-align: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .contact-title {
        font-size: 2.5rem;
        color: #2c3e50;
        margin-bottom: 0.5rem;
    }

    .contact-subtitle {
        color: #7f8c8d;
        font-size: 1.1rem;
        margin-bottom: 3rem;
    }

    .contact-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1.5rem;
    }

    .contact-card {
        background: #ffffff;
        padding: 2rem 1.5rem;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        border: 1px solid #e2e8f0;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .contact-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }

    .icon {
        font-size: 2.5rem;
        margin-bottom: 1rem;
    }

    .contact-card h3 {
        margin-bottom: 0.7rem;
        color: #34495e;
        font-size: 1.3rem;
    }

    .contact-card p a {
        color: #3498db;
        text-decoration: none;
        font-weight: 500;
        word-break: break-all;
    }

    .contact-card p a:hover {
        text-decoration: underline;
    }

    /* Target specific hover element updates if needed */
    .github:hover { border-color: #24292e; }
    .linkedin:hover { border-color: #0077b5; }
    .instagram:hover { border-color: #e1306c; }
</style>
{% endblock content %}
